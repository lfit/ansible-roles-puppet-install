---
- name: Install requirements based on platform
  ansible.builtin.include_tasks: '{{ item }}'
  with_first_found:
    - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["architecture"] }}.yml'
    - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
    - '{{ ansible_facts["distribution"] }}.yml'
    - '{{ ansible_facts["os_family"] }}.yml'

- name: Look for the Puppet Labs binaries
  ansible.builtin.stat:
    path: "{{ item }}"
  register: puppet_install_binaries
  loop:
    - /opt/puppetlabs/bin/facter
    - /opt/puppetlabs/puppet/bin/puppet

- name: Report a missing Puppet Labs agent
  ansible.builtin.debug:
    msg: >-
      {{ item.item }} is missing, so it was not linked into /usr/bin.
      puppet-agent was either skipped for this release or satisfied by the
      distribution archive rather than Puppet Labs. Check that
      puppet_install_apt_component names a component that carries the agent
      for {{ ansible_facts['distribution_release'] | default('this release') }}.
  loop: "{{ puppet_install_binaries.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Symlink facter
  ansible.builtin.file:
    src: /opt/puppetlabs/bin/facter
    dest: /usr/bin/facter
    state: link
    force: yes
  when:
    - ansible_facts["architecture"] != 'aarch64'
    - ansible_facts["distribution"] == 'Ubuntu' or ansible_facts["distribution"] == 'CentOS'
    - ansible_facts["distribution_version"] != '18.04'
    # Never force a link onto a target that is not there. Doing so replaced
    # any working facter with a broken one and reported success.
    - puppet_install_binaries.results[0].stat.exists
  become: true

- name: Symlink puppet
  ansible.builtin.file:
    src: /opt/puppetlabs/puppet/bin/puppet
    dest: /usr/bin/puppet
    state: link
    force: yes
  when:
    - ansible_facts["architecture"] != 'aarch64'
    - ansible_facts["distribution"] == 'Ubuntu' or ansible_facts["distribution"] == 'CentOS'
    - ansible_facts["distribution_version"] != '18.04'
    - puppet_install_binaries.results[1].stat.exists
  become: true
